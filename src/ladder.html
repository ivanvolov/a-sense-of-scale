<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A Sense of Scale — Nested</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">

<style>
:root {
  --bg: #04060d;
  --ink: #eaf0fb;
  --dim: #8593ad;
  --faint: #4a5670;
  --line: #222d44;
  --accent: #ffcf5c;
  --panel: rgba(8, 13, 25, 0.72);
  --sans: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}

#stage {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

#top {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 2;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
           0 max(16px, env(safe-area-inset-left));
  pointer-events: none;
}
#brand {
  font-size: 11px;
  font-weight: 600;
  line-height: 1.45;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--dim);
}
#brand a { color: inherit; text-decoration: none; pointer-events: auto; }
#brand a:hover { color: var(--ink); }
#title {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -.01em;
  margin-top: 2px;
}
#hint {
  margin-top: 6px;
  max-width: 34ch;
  font-size: 13px;
  line-height: 1.45;
  color: var(--dim);
}
#count {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--dim);
  padding-top: 4px;
}

#bottom {
  position: fixed;
  left: 0; right: 0;
  bottom: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 max(14px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
}
.arrow {
  flex: none;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  font: 600 24px var(--sans);
  cursor: pointer;
  display: grid;
  place-items: center;
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  transition: border-color .15s, color .15s, opacity .15s;
}
.arrow:hover { border-color: var(--accent); color: var(--accent); }
.arrow:disabled { opacity: .25; cursor: default; }
.arrow:disabled:hover { border-color: var(--line); color: var(--ink); }

#dots {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 5px;
  min-width: 0;
}
.dot {
  width: 8px;
  height: 8px;
  flex: 0 1 8px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: var(--c);
  opacity: .28;
  cursor: pointer;
  transition: transform .2s, opacity .2s;
}
.dot:hover { opacity: .7; }
.dot.on { opacity: 1; transform: scale(1.6); }

@media (max-width: 560px) {
  #title { font-size: 17px; }
  #hint { display: none; }
  .arrow { width: 48px; height: 48px; font-size: 20px; }
  .dot { width: 6px; height: 6px; flex-basis: 6px; gap: 3px; }
  #dots { gap: 3px; }
}
</style>
</head>
<body>

<canvas id="stage"></canvas>

<div id="top">
  <div>
    <div id="brand"><a href="./">A Sense of Scale</a></div>
    <div id="title">Nested</div>
    <div id="hint">Each thing fills the bar. Press → and it shrinks into the sliver it really is next to the one above.</div>
  </div>
  <div id="count">—</div>
</div>

<div id="bottom">
  <button class="arrow" id="prev" aria-label="Smaller">←</button>
  <div id="dots"></div>
  <button class="arrow" id="next" aria-label="Bigger">→</button>
</div>

<script type="module" src="./ladder.js"></script>
</body>
</html>
