<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A Sense of Scale — demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
:root {
  --bg: #e7e9ed;
  --bg2: #f4f5f7;
  --card: rgba(255, 255, 255, 0.86);
  --card-solid: #ffffff;
  --ink: #1d2230;
  --dim: #6f7786;
  --faint: #aab1be;
  --line: rgba(29, 34, 48, 0.08);
  --teal: #17a589;
  --teal-ink: #0f8a72;
  --teal-soft: rgba(23, 165, 137, 0.12);
  --orange: #f09a4b;
  --orange-soft: rgba(240, 154, 75, 0.16);
  --violet: #5d55d6;
  --display: 'Outfit', 'Inter', system-ui, sans-serif;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  --radius: 18px;
  --shadow: 0 1px 2px rgba(20, 24, 36, 0.05), 0 12px 32px -12px rgba(20, 24, 36, 0.18);
  --card-edge: rgba(255, 255, 255, 0.7);
  --hover: rgba(29, 34, 48, .05);
  --track: rgba(29, 34, 48, .08);
  --label: #5d55d6;
  --label2: #4b4f9a;
  --body-text: #3b4150;
  --tip-bg: rgba(238, 236, 252, .9);
  --tip-ink: #3b3f6b;
  --halo: #fff;
}
html[data-theme="dark"] {
  --bg: #0a0d14;
  --bg2: #151a26;
  --card: rgba(21, 25, 36, 0.78);
  --card-solid: #1b2030;
  --ink: #e9ecf3;
  --dim: #98a1b4;
  --faint: #5c6476;
  --line: rgba(255, 255, 255, 0.08);
  --teal: #22c1a0;
  --teal-ink: #4fd9bb;
  --teal-soft: rgba(34, 193, 160, 0.16);
  --orange: #f2a052;
  --orange-soft: rgba(242, 160, 82, 0.2);
  --violet: #a9a4ff;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 16px 40px -14px rgba(0, 0, 0, 0.7);
  --card-edge: rgba(255, 255, 255, 0.08);
  --hover: rgba(255, 255, 255, .06);
  --track: rgba(255, 255, 255, .1);
  --label: #b9b5ff;
  --label2: #9a97d8;
  --body-text: #c3c9d6;
  --tip-bg: rgba(44, 42, 78, .85);
  --tip-ink: #d6d3ff;
  --halo: #1b2030;
}
html[data-theme="dark"] body {
  background: radial-gradient(120% 90% at 50% 45%, var(--bg2) 0%, var(--bg) 60%, #05070b 100%);
}
html[data-theme="dark"] .body .thumb { box-shadow: inset -9px -6px 14px rgba(0, 0, 0, .6), inset 4px 4px 10px rgba(255, 255, 255, .14), 0 2px 6px rgba(0, 0, 0, .5); }
html[data-theme="dark"] .marker::after { border-color: rgba(255, 255, 255, .3); }
html[data-theme="dark"] .marker { background: #fff; box-shadow: 0 0 0 3px var(--halo), 0 0 0 4px rgba(255, 255, 255, .25); }
html[data-theme="dark"] #dock button.on { box-shadow: 0 8px 20px -8px rgba(34, 193, 160, .6); }
html[data-theme="dark"] #theme { color: #ffd98a; }

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  overflow: hidden;
  font-family: var(--sans);
  color: var(--ink);
  background:
    radial-gradient(120% 90% at 50% 45%, var(--bg2) 0%, var(--bg) 60%, #dfe2e7 100%);
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}

/* ---------------------------------------------------------------- stage -- */

#stage {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: grab;
}
#stage.dragging { cursor: grabbing; }


/* Labels and markers projected from the 3D scene. */
#labels {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  overflow: hidden;
}
.label {
  position: absolute;
  left: 0;
  top: 0;
  will-change: transform;
  text-align: center;
  white-space: nowrap;
  transition: opacity .25s ease;
}
.label b {
  display: block;
  font-family: var(--display);
  font-weight: 600;
  font-size: 15px;
  letter-spacing: .01em;
  color: var(--label);
}
.label small {
  display: block;
  font-size: 11px;
  line-height: 1.35;
  color: var(--label2);
}
.label.cool b { color: var(--teal-ink); }
.label.cool small { color: #2e7d6b; }
.marker {
  position: absolute;
  left: 0;
  top: 0;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  will-change: transform;
  background: var(--ink);
  box-shadow: 0 0 0 3px var(--halo), 0 0 0 4px rgba(29, 34, 48, .18);
}
.marker::after {
  content: '';
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 1px solid rgba(29, 34, 48, .25);
}

/* --------------------------------------------------------------- layout -- */

#ui {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  display: grid;
  grid-template-columns: 272px 1fr 332px;
  grid-template-rows: auto 1fr auto;
  gap: 16px;
  padding: 16px;
}
#ui > * { min-width: 0; }
.card {
  pointer-events: auto;
  background: var(--card);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--card-edge);
}
.eyebrow {
  font-family: var(--display);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--dim);
}

/* left column */
#brand {
  grid-column: 1;
  grid-row: 1;
  align-self: start;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 18px;
}
#brand .mark { flex: none; width: 38px; height: 38px; }
#brand h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 600;
  font-size: 14.5px;
  letter-spacing: .14em;
  white-space: nowrap;
  text-transform: uppercase;
  color: var(--teal);
}

#list {
  grid-column: 1;
  grid-row: 2 / 4;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow: auto;
  scrollbar-width: none;
}
#list::-webkit-scrollbar { display: none; }
.body {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 1.5px solid var(--line);
  background: var(--card-solid);
  cursor: pointer;
  text-align: left;
  font: inherit;
  color: inherit;
  transition: border-color .2s, transform .2s, box-shadow .2s;
}
.body:hover { border-color: var(--faint); transform: translateX(2px); }
.body.on {
  border-color: var(--orange);
  box-shadow: 0 0 0 3px var(--orange-soft);
}
.body .thumb {
  flex: none;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background-size: 200% 100%;
  background-position: 30% 50%;
  box-shadow: inset -9px -6px 14px rgba(0, 0, 0, .45), inset 4px 4px 10px rgba(255, 255, 255, .22), 0 2px 6px rgba(20, 24, 36, .18);
}
.body .thumb.ringed::after {
  content: '';
  position: absolute;
  left: 2px;
  top: 17px;
  width: 62px;
  height: 14px;
  border-radius: 50%;
  border: 3px solid rgba(214, 193, 150, .85);
  transform: rotate(-18deg);
  -webkit-mask: linear-gradient(#000 0 50%, transparent 50% 100%);
          mask: linear-gradient(#000 0 50%, transparent 50% 100%);
}
.body b {
  display: block;
  font-family: var(--display);
  font-weight: 600;
  font-size: 14px;
  letter-spacing: .14em;
  text-transform: uppercase;
}
.body small { display: block; color: var(--dim); font-size: 11.5px; margin-top: 2px; }
.body .tag {
  position: absolute;
  right: -1.5px;
  top: -1.5px;
  bottom: -1.5px;
  width: 20px;
  border-radius: 0 14px 14px 0;
  background: var(--teal);
  color: #fff;
  font-family: var(--display);
  font-size: 8.5px;
  letter-spacing: .18em;
  text-transform: uppercase;
  writing-mode: vertical-rl;
  display: none;
  align-items: center;
  justify-content: center;
}
.body.on .tag { display: flex; }
.rowwrap { position: relative; display: flex; flex: none; }
.rowwrap .body { flex: 1; min-width: 0; }
body.sizes .rowwrap .body { padding-right: 66px; }
.rowwrap .zoom {
  position: absolute;
  right: 28px;
  top: 50%;
  width: 30px;
  height: 30px;
  margin-top: -15px;
  display: grid;
  place-items: center;
  padding: 0;
  border-radius: 50%;
  border: 1.5px solid var(--line);
  background: var(--card-solid);
  color: var(--dim);
  cursor: pointer;
  transition: color .15s, border-color .15s, background .15s, transform .15s;
}
.rowwrap .zoom:hover { color: #fff; background: var(--orange); border-color: var(--orange); transform: scale(1.08); }


/* centre */
#head {
  grid-column: 2;
  grid-row: 1 / 3;
  padding: 2px 10px 0 18px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}
#title {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 0;
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(34px, 4.6vw, 62px);
  line-height: 1;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--teal);
  transition: opacity .3s ease, transform .3s ease;
}
#title .orb {
  flex: none;
  width: .5em;
  height: .5em;
  border-radius: 50%;
  border: 2px solid var(--orange);
  position: relative;
}
#title .orb::before {
  content: '';
  position: absolute;
  inset: 25%;
  border-radius: 50%;
  background: var(--orange);
}
#epithet { font-size: 12px; letter-spacing: .3em; margin-left: 2px; }
#blurb {
  margin: 8px 0 0;
  max-width: 34ch;
  font-size: 14.5px;
  line-height: 1.5;
  color: var(--body-text);
}
#chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 12px;
  border-radius: 999px;
  background: var(--card);
  border: 1px solid var(--line);
  font-family: var(--display);
  font-size: 11px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink);
}
.chip i { font-style: normal; color: var(--teal); }
#head.swap #title, #head.swap #epithet, #head.swap #blurb, #head.swap #chips { opacity: 0; transform: translateY(-6px); }
#head.empty { display: none; }
#epithet, #blurb, #chips { transition: opacity .3s ease, transform .3s ease; }

#dock {
  grid-column: 2;
  grid-row: 3;
  justify-self: center;
  align-self: end;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px;
  border-radius: 999px;
}
#dock button {
  appearance: none;
  border: 0;
  background: transparent;
  border-radius: 999px;
  padding: 12px 14px;
  font-family: var(--display);
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  white-space: nowrap;
  color: var(--ink);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: background .2s, color .2s;
}
#dock button:hover { background: var(--hover); }
#dock button.on { background: var(--teal); color: #fff; box-shadow: 0 8px 20px -8px rgba(23, 165, 137, .7); }
#dock button.go { background: var(--orange); color: #fff; }
#dock button.tog { color: var(--dim); }
#dock button.tog.on { background: var(--teal-soft); color: var(--teal-ink); box-shadow: none; }
#dock button.go:hover { background: #e38a3a; }
#dock button i { font-style: normal; font-size: 14px; }
#dock .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
#dock .seg {
  display: inline-flex;
  gap: 2px;
  padding: 3px;
  border-radius: 999px;
  background: var(--track);
}
#dock .seg button { padding: 8px 12px; font-size: 11.5px; color: var(--dim); }
#dock .seg button.on { background: var(--card-solid); color: var(--teal-ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }

#dots {
  grid-column: 2;
  grid-row: 3;
  justify-self: center;
  align-self: end;
  margin-bottom: -4px;
  transform: translateY(14px);
  display: flex;
  gap: 6px;
  pointer-events: auto;
}
#dots i {
  width: 18px;
  height: 3px;
  border-radius: 2px;
  background: var(--track);
  cursor: pointer;
}
#dots i.on { background: var(--teal); }

/* right column */
#modes {
  grid-column: 3;
  grid-row: 1;
  align-self: start;
  padding: 8px;
  display: flex;
  gap: 6px;
  align-items: center;
}
#modes button {
  flex: 1;
  appearance: none;
  border: 0;
  background: transparent;
  border-radius: 12px;
  padding: 11px 10px;
  font-family: var(--display);
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--dim);
  cursor: pointer;
}
#modes button.on { background: var(--teal-soft); color: var(--teal-ink); }
#modes #theme {
  flex: none;
  width: 38px;
  padding: 0;
  height: 38px;
  border-radius: 50%;
  font-size: 16px;
  line-height: 1;
  color: var(--dim);
}
#modes #theme:hover { background: var(--hover); }

#side {
  grid-column: 3;
  grid-row: 2 / 4;
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-height: 0;
  overflow: hidden;
  pointer-events: none;
}
#side .card { padding: 16px 18px; }
#overview .eyebrow { display: flex; justify-content: space-between; align-items: center; }
#overview .eyebrow::after {
  content: '';
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--teal);
  box-shadow: 0 0 0 3px var(--teal-soft);
}
#rows { display: flex; flex-direction: column; margin-top: 8px; }
.row2 {
  display: grid;
  grid-template-columns: 22px 1fr auto;
  align-items: center;
  column-gap: 10px;
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
}
.row2:last-child { border-bottom: 0; }
.row2 .ic { color: var(--teal); font-size: 13px; text-align: center; grid-column: 1; grid-row: 1 / 3; }
.row2 .lb { grid-column: 2; grid-row: 1; font-family: var(--display); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
.row2 .vl { grid-column: 3; grid-row: 1 / 3; font-weight: 600; font-size: 13.5px; text-align: right; font-variant-numeric: tabular-nums; }
.row2 .bar { grid-column: 2; grid-row: 2; display: flex; gap: 3px; margin-top: 5px; }
.row2 .bar i {
  width: 11px;
  height: 4px;
  border-radius: 2px;
  background: var(--track);
  transform-origin: left;
}
.row2 .bar i.on { background: var(--teal); }
.row2 .bar.warm i.on { background: var(--orange); }

/* Sizes mode: no head text, no tools, no dots; the overview is the table. */
body.sizes #head, body.sizes #dots { display: none; }
#overview .hint { margin-top: 10px; font-size: 12.5px; color: var(--dim); line-height: 1.5; }
.cmp {
  display: grid;
  grid-template-columns: 30px 1fr auto;
  align-items: center;
  column-gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
}
.cmp:last-child { border-bottom: 0; }
.cmp .thumb {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background-size: 200% 100%;
  background-position: 30% 50%;
  box-shadow: inset -6px -4px 10px rgba(0, 0, 0, .45), inset 3px 3px 7px rgba(255, 255, 255, .22);
}
.cmp b { display: block; font-family: var(--display); font-size: 12.5px; letter-spacing: .12em; text-transform: uppercase; }
.cmp small { display: block; color: var(--dim); font-size: 11px; margin-top: 2px; }
.cmp .num { text-align: right; font-variant-numeric: tabular-nums; }
.cmp .num b { font-family: var(--mono); font-weight: 500; letter-spacing: 0; text-transform: none; font-size: 13px; }
.cmp .num small { font-family: var(--mono); }
.cmp .scale { grid-column: 2 / 4; height: 3px; border-radius: 2px; background: var(--teal); margin-top: 6px; transform-origin: left; }
#clockTime { font-family: var(--mono); font-size: 26px; font-weight: 500; letter-spacing: .02em; margin-top: 8px; }
#clockMeta { font-family: var(--mono); font-size: 11px; color: var(--dim); margin-top: 2px; }
#clockMeta b { color: var(--teal-ink); font-weight: 500; }
#clockBarWrap { height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; margin: 10px 0 6px; }
#clockBar { display: block; height: 100%; width: 0%; background: var(--teal); border-radius: 2px; }
#clockArrivals { margin: 0; padding: 0; list-style: none; font-size: 12px; display: flex; flex-direction: column; }
#clockArrivals li { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
#clockArrivals li:last-child { border-bottom: 0; }
#clockArrivals li b { font-family: var(--display); font-weight: 600; letter-spacing: .1em; text-transform: uppercase; font-size: 11.5px; }
#clockArrivals li span { font-family: var(--mono); color: var(--teal-ink); }
#clockArrivals li.next { opacity: .45; }
#clockArrivals li.next span { color: var(--dim); }


#tip {
  flex: none;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: var(--tip-bg);
  font-size: 12px;
  color: var(--tip-ink);
  line-height: 1.4;
}
#tip .ic {
  flex: none;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 1.5px solid var(--violet);
  color: var(--violet);
  display: grid;
  place-items: center;
  font-size: 12px;
}
#tip button { margin-left: auto; appearance: none; border: 0; background: transparent; color: var(--faint); font-size: 16px; cursor: pointer; }


#loading {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: grid;
  place-items: center;
  background: var(--bg);
  font-family: var(--display);
  letter-spacing: .3em;
  text-transform: uppercase;
  font-size: 12px;
  color: var(--dim);
  transition: opacity .6s ease;
}
#loading.off { opacity: 0; pointer-events: none; }

@media (max-width: 1100px) {
  #ui { grid-template-columns: 232px 1fr 290px; }
}
@media (max-width: 860px) {
  #ui {
    grid-template-columns: 1fr;
    grid-template-rows: auto auto 1fr auto;
    gap: 10px;
    padding: 10px;
  }
  #brand, #list, #modes, #side, #dots { display: none; }
  #head { grid-column: 1; grid-row: 1; }
  #dock { grid-column: 1; grid-row: 4; }
}
</style>
</head>
<body>

<canvas id="stage"></canvas>
<div id="labels"></div>

<div id="ui">
  <div id="brand" class="card">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="11" fill="none" stroke="#f09a4b" stroke-width="1.6"/>
      <circle cx="32" cy="32" r="19" fill="none" stroke="#17a589" stroke-width="1.3" opacity=".85"/>
      <circle cx="32" cy="32" r="27" fill="none" stroke="#17a589" stroke-width="1" opacity=".4"/>
      <circle cx="32" cy="32" r="4.6" fill="#f09a4b"/>
      <circle cx="45.4" cy="18.6" r="2.4" fill="#17a589"/>
      <circle cx="12.4" cy="44.5" r="1.7" fill="#5d55d6"/>
    </svg>
    <h1>A Sense of Scale</h1>
  </div>

  <div id="list" class="card"></div>

  <div id="head">
    <h2 id="title"><span class="orb"></span><span id="titleText">Earth</span></h2>
    <div id="epithet" class="eyebrow"></div>
    <p id="blurb"></p>
    <div id="chips"></div>
  </div>

  <div id="dock" class="card"></div>
  <div id="dots"></div>

  <div id="modes" class="card">
    <button data-mode="earth-moon" class="on">Sizes</button>
    <button data-mode="solar-system">Distances</button>
    <button id="theme" title="Light / dark" aria-label="Toggle theme">☾</button>
  </div>

  <div id="side">
    <div id="overview" class="card">
      <div class="eyebrow" id="overviewTitle">Overview</div>
      <div id="rows"></div>
    </div>
    <div id="tip" class="card">
      <span class="ic">i</span>
      <span id="tipText">Drag to orbit, scroll to zoom. Pick a body on the left to fly there.</span>
      <button id="tipClose" aria-label="Dismiss">×</button>
    </div>
  </div>
</div>

<div id="loading">Loading textures</div>

<script type="importmap">
