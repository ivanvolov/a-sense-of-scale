<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A Sense of Scale — demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
:root {
  --bg: #e7e9ed;
  --bg2: #f4f5f7;
  --card: rgba(255, 255, 255, 0.86);
  --card-solid: #ffffff;
  --ink: #1d2230;
  --dim: #6f7786;
  --faint: #aab1be;
  --line: rgba(29, 34, 48, 0.08);
  --teal: #17a589;
  --teal-ink: #0f8a72;
  --teal-soft: rgba(23, 165, 137, 0.12);
  --orange: #f09a4b;
  --orange-soft: rgba(240, 154, 75, 0.16);
  --violet: #5d55d6;
  --display: 'Outfit', 'Inter', system-ui, sans-serif;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  --radius: 18px;
  --shadow: 0 1px 2px rgba(20, 24, 36, 0.05), 0 12px 32px -12px rgba(20, 24, 36, 0.18);
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  overflow: hidden;
  font-family: var(--sans);
  color: var(--ink);
  background:
    radial-gradient(120% 90% at 50% 45%, var(--bg2) 0%, var(--bg) 60%, #dfe2e7 100%);
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}

/* ---------------------------------------------------------------- stage -- */

#stage {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: grab;
}
#stage.dragging { cursor: grabbing; }

/* The pedestal: a white dish under whatever the camera is looking at, with
   the two glowing guide rings and a dashed tick ring, as on his planets. */
#pedestal {
  position: fixed;
  left: 50%;
  bottom: 9vh;
  width: min(44vw, 520px);
  aspect-ratio: 3.4 / 1;
  transform: translateX(-50%);
  pointer-events: none;
  z-index: 0;
  transition: opacity .6s ease;
}
#pedestal::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background:
    radial-gradient(ellipse at 50% 42%, #ffffff 0%, #f6f7f9 48%, #e9ebef 70%, rgba(233, 235, 239, 0) 71%);
  box-shadow: 0 30px 50px -20px rgba(20, 24, 36, 0.28), inset 0 -8px 20px rgba(20, 24, 36, 0.05);
}
#pedestal .ring {
  position: absolute;
  border-radius: 50%;
  border: 2px solid var(--orange);
  inset: 10% 12%;
  opacity: .85;
  filter: drop-shadow(0 0 6px rgba(240, 154, 75, .55));
}
#pedestal .ring.teal {
  inset: 24% 24%;
  border-color: var(--teal);
  border-width: 1.5px;
  filter: drop-shadow(0 0 6px rgba(23, 165, 137, .55));
}
#pedestal .ticks {
  position: absolute;
  inset: 17% 18%;
  border-radius: 50%;
  background:
    repeating-conic-gradient(from 0deg, #e5604f 0deg 1.2deg, transparent 1.2deg 6deg);
  -webkit-mask: radial-gradient(ellipse at center, transparent 86%, #000 87%, #000 100%);
          mask: radial-gradient(ellipse at center, transparent 86%, #000 87%, #000 100%);
  opacity: .9;
}

/* Labels and markers projected from the 3D scene. */
#labels {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  overflow: hidden;
}
.label {
  position: absolute;
  transform: translate(-50%, -100%);
  text-align: center;
  white-space: nowrap;
  transition: opacity .25s ease;
}
.label b {
  display: block;
  font-family: var(--display);
  font-weight: 600;
  font-size: 15px;
  letter-spacing: .01em;
  color: var(--violet);
}
.label small {
  display: block;
  font-size: 11px;
  line-height: 1.35;
  color: #4b4f9a;
}
.label.cool b { color: var(--teal-ink); }
.label.cool small { color: #2e7d6b; }
.marker {
  position: absolute;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  background: var(--ink);
  box-shadow: 0 0 0 3px #fff, 0 0 0 4px rgba(29, 34, 48, .18);
}
.marker::after {
  content: '';
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 1px solid rgba(29, 34, 48, .25);
}

/* --------------------------------------------------------------- layout -- */

#ui {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  display: grid;
  grid-template-columns: 272px 1fr 332px;
  grid-template-rows: auto 1fr auto;
  gap: 16px;
  padding: 16px;
}
#ui > * { min-width: 0; }
.card {
  pointer-events: auto;
  background: var(--card);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid rgba(255, 255, 255, 0.7);
}
.eyebrow {
  font-family: var(--display);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--dim);
}

/* left column */
#brand {
  grid-column: 1;
  grid-row: 1;
  align-self: start;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 18px;
}
#brand .mark {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 2px solid var(--teal);
  display: grid;
  place-items: center;
  position: relative;
}
#brand .mark::before {
  content: '';
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--teal);
}
#brand .mark::after {
  content: '';
  position: absolute;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--orange);
  top: -3px;
  right: 1px;
}
#brand h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 600;
  font-size: 13.5px;
  letter-spacing: .14em;
  white-space: nowrap;
  text-transform: uppercase;
  color: var(--teal);
}
#brand .eyebrow { margin-top: 3px; font-size: 9px; white-space: nowrap; }

#list {
  grid-column: 1;
  grid-row: 2;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow: auto;
  scrollbar-width: none;
}
#list::-webkit-scrollbar { display: none; }
.body {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 1.5px solid var(--line);
  background: var(--card-solid);
  cursor: pointer;
  text-align: left;
  font: inherit;
  color: inherit;
  transition: border-color .2s, transform .2s, box-shadow .2s;
}
.body:hover { border-color: rgba(29, 34, 48, .18); transform: translateX(2px); }
.body.on {
  border-color: var(--orange);
  box-shadow: 0 0 0 3px var(--orange-soft);
}
.body .thumb {
  flex: none;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background-size: 200% 100%;
  background-position: 30% 50%;
  box-shadow: inset -9px -6px 14px rgba(0, 0, 0, .45), inset 4px 4px 10px rgba(255, 255, 255, .22), 0 2px 6px rgba(20, 24, 36, .18);
}
.body .thumb.ringed::after {
  content: '';
  position: absolute;
  left: 2px;
  top: 17px;
  width: 62px;
  height: 14px;
  border-radius: 50%;
  border: 3px solid rgba(214, 193, 150, .85);
  transform: rotate(-18deg);
  -webkit-mask: linear-gradient(#000 0 50%, transparent 50% 100%);
          mask: linear-gradient(#000 0 50%, transparent 50% 100%);
}
.body b {
  display: block;
  font-family: var(--display);
  font-weight: 600;
  font-size: 14px;
  letter-spacing: .14em;
  text-transform: uppercase;
}
.body small { display: block; color: var(--dim); font-size: 11.5px; margin-top: 2px; }
.body .tag {
  position: absolute;
  right: -1.5px;
  top: -1.5px;
  bottom: -1.5px;
  width: 20px;
  border-radius: 0 14px 14px 0;
  background: var(--teal);
  color: #fff;
  font-family: var(--display);
  font-size: 8.5px;
  letter-spacing: .18em;
  text-transform: uppercase;
  writing-mode: vertical-rl;
  display: none;
  align-items: center;
  justify-content: center;
}
.body.on .tag { display: flex; }

#clock {
  grid-column: 1;
  grid-row: 3;
  padding: 14px 18px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
#clock .row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
#clockTime { font-family: var(--mono); font-size: 22px; font-weight: 500; letter-spacing: .02em; }
#clockSpeed { font-family: var(--mono); font-size: 11px; color: var(--teal-ink); }
#clockTravel { font-family: var(--mono); font-size: 11px; color: var(--dim); }
#clock .bar {
  height: 4px;
  border-radius: 2px;
  background: rgba(29, 34, 48, .08);
  overflow: hidden;
}
#clock .bar i {
  display: block;
  height: 100%;
  width: 0%;
  background: var(--teal);
  border-radius: 2px;
  transition: width .2s linear;
}
#clockArrivals {
  margin: 4px 0 0;
  padding: 0;
  list-style: none;
  font-size: 11.5px;
  color: var(--dim);
  display: flex;
  flex-direction: column;
  gap: 2px;
  max-height: 96px;
  overflow: hidden;
}
#clockArrivals li { display: flex; justify-content: space-between; gap: 10px; }
#clockArrivals li b { color: var(--ink); font-weight: 500; }
#clockArrivals li span { font-family: var(--mono); }

/* centre */
#head {
  grid-column: 2;
  grid-row: 1 / 3;
  padding: 2px 10px 0 18px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}
#title {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 0;
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(34px, 4.6vw, 62px);
  line-height: 1;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--teal);
  transition: opacity .3s ease, transform .3s ease;
}
#title .orb {
  flex: none;
  width: .5em;
  height: .5em;
  border-radius: 50%;
  border: 2px solid var(--orange);
  position: relative;
}
#title .orb::before {
  content: '';
  position: absolute;
  inset: 25%;
  border-radius: 50%;
  background: var(--orange);
}
#epithet { font-size: 12px; letter-spacing: .3em; margin-left: 2px; }
#blurb {
  margin: 8px 0 0;
  max-width: 34ch;
  font-size: 14.5px;
  line-height: 1.5;
  color: #3b4150;
}
#chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 12px;
  border-radius: 999px;
  background: rgba(255, 255, 255, .8);
  border: 1px solid var(--line);
  font-family: var(--display);
  font-size: 11px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink);
}
.chip i { font-style: normal; color: var(--teal); }
#head.swap #title, #head.swap #epithet, #head.swap #blurb, #head.swap #chips { opacity: 0; transform: translateY(-6px); }
#epithet, #blurb, #chips { transition: opacity .3s ease, transform .3s ease; }

#dock {
  grid-column: 2;
  grid-row: 3;
  justify-self: center;
  align-self: end;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px;
  border-radius: 999px;
}
#dock button {
  appearance: none;
  border: 0;
  background: transparent;
  border-radius: 999px;
  padding: 12px 20px;
  font-family: var(--display);
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: background .2s, color .2s;
}
#dock button:hover { background: rgba(29, 34, 48, .05); }
#dock button.on { background: var(--teal); color: #fff; box-shadow: 0 8px 20px -8px rgba(23, 165, 137, .7); }
#dock button.go { background: var(--orange); color: #fff; }
#dock button.go:hover { background: #e38a3a; }
#dock button i { font-style: normal; font-size: 14px; }
#dock .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }

#dots {
  grid-column: 2;
  grid-row: 3;
  justify-self: center;
  align-self: end;
  margin-bottom: -4px;
  transform: translateY(14px);
  display: flex;
  gap: 6px;
  pointer-events: auto;
}
#dots i {
  width: 18px;
  height: 3px;
  border-radius: 2px;
  background: rgba(29, 34, 48, .14);
  cursor: pointer;
}
#dots i.on { background: var(--teal); }

/* right column */
#modes {
  grid-column: 3;
  grid-row: 1;
  align-self: start;
  padding: 8px;
  display: flex;
  gap: 6px;
  align-items: center;
}
#modes button {
  flex: 1;
  appearance: none;
  border: 0;
  background: transparent;
  border-radius: 12px;
  padding: 11px 10px;
  font-family: var(--display);
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--dim);
  cursor: pointer;
}
#modes button.on { background: var(--teal-soft); color: var(--teal-ink); }
#modes .badge {
  flex: none;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--orange);
  border: 1px solid rgba(240, 154, 75, .5);
  border-radius: 999px;
  padding: 3px 8px;
  margin: 0 4px;
}

#side {
  grid-column: 3;
  grid-row: 2 / 4;
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-height: 0;
  overflow: hidden;
  pointer-events: none;
}
#side .card { padding: 16px 18px; }
#overview .eyebrow { display: flex; justify-content: space-between; align-items: center; }
#overview .eyebrow::after {
  content: '';
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--teal);
  box-shadow: 0 0 0 3px var(--teal-soft);
}
#rows { display: flex; flex-direction: column; margin-top: 8px; }
.row2 {
  display: grid;
  grid-template-columns: 22px 1fr auto;
  align-items: center;
  column-gap: 10px;
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
}
.row2:last-child { border-bottom: 0; }
.row2 .ic { color: var(--teal); font-size: 13px; text-align: center; grid-column: 1; grid-row: 1 / 3; }
.row2 .lb { grid-column: 2; grid-row: 1; font-family: var(--display); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
.row2 .vl { grid-column: 3; grid-row: 1 / 3; font-weight: 600; font-size: 13.5px; text-align: right; font-variant-numeric: tabular-nums; }
.row2 .bar { grid-column: 2; grid-row: 2; display: flex; gap: 3px; margin-top: 5px; }
.row2 .bar i {
  width: 11px;
  height: 4px;
  border-radius: 2px;
  background: rgba(29, 34, 48, .08);
  transform-origin: left;
}
.row2 .bar i.on { background: var(--teal); }
.row2 .bar.warm i.on { background: var(--orange); }

#tools { flex: none; }
#tools ul { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
#tools li {
  display: grid;
  grid-template-columns: 38px 1fr 16px;
  gap: 12px;
  align-items: center;
  padding: 10px 6px 10px 2px;
  border-radius: 12px;
  cursor: pointer;
  transition: background .2s;
}
#tools li:hover { background: rgba(29, 34, 48, .04); }
#tools li.on .ic { background: var(--teal); color: #fff; }
#tools li.off { opacity: .4; pointer-events: none; }
#tools .ic {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 16px;
  background: var(--orange-soft);
  color: #c9772a;
}
#tools .ic.v { background: rgba(93, 85, 214, .14); color: var(--violet); }
#tools .ic.t { background: var(--teal-soft); color: var(--teal-ink); }
#tools b { display: block; font-family: var(--display); font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; }
#tools small { display: block; color: var(--dim); font-size: 11.5px; line-height: 1.4; margin-top: 2px; }
#tools .chev { color: var(--faint); font-size: 14px; }

#tip {
  flex: none;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: rgba(238, 236, 252, .9);
  font-size: 12px;
  color: #3b3f6b;
  line-height: 1.4;
}
#tip .ic {
  flex: none;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 1.5px solid var(--violet);
  color: var(--violet);
  display: grid;
  place-items: center;
  font-size: 12px;
}
#tip button { margin-left: auto; appearance: none; border: 0; background: transparent; color: var(--faint); font-size: 16px; cursor: pointer; }

#scaleNote {
  position: fixed;
  left: 50%;
  top: 18px;
  transform: translateX(-50%);
  z-index: 3;
  pointer-events: none;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--dim);
  letter-spacing: .04em;
  background: rgba(255, 255, 255, .7);
  padding: 5px 10px;
  border-radius: 999px;
  opacity: 0;
  transition: opacity .3s;
}
#scaleNote.on { opacity: 1; }

#loading {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: grid;
  place-items: center;
  background: var(--bg);
  font-family: var(--display);
  letter-spacing: .3em;
  text-transform: uppercase;
  font-size: 12px;
  color: var(--dim);
  transition: opacity .6s ease;
}
#loading.off { opacity: 0; pointer-events: none; }

@media (max-width: 1100px) {
  #ui { grid-template-columns: 232px 1fr 290px; }
}
@media (max-width: 860px) {
  #ui {
    grid-template-columns: 1fr;
    grid-template-rows: auto auto 1fr auto;
    gap: 10px;
    padding: 10px;
  }
  #brand, #list, #clock, #modes, #side, #dots, #scaleNote { display: none; }
  #head { grid-column: 1; grid-row: 1; }
  #dock { grid-column: 1; grid-row: 4; }
  #pedestal { bottom: 12vh; width: 70vw; }
}
</style>
</head>
<body>

<canvas id="stage"></canvas>
<div id="pedestal"><div class="ring"></div><div class="ticks"></div><div class="ring teal"></div></div>
<div id="labels"></div>
<div id="scaleNote"></div>

<div id="ui">
  <div id="brand" class="card">
    <div class="mark"></div>
    <div>
      <h1>A Sense of Scale</h1>
      <div class="eyebrow">True sizes · true distances</div>
    </div>
  </div>

  <div id="list" class="card"></div>

  <div id="clock" class="card">
    <div class="eyebrow">Light clock</div>
    <div class="row"><span id="clockTime">0.00 s</span><span id="clockSpeed">real time</span></div>
    <div class="bar"><i id="clockBar"></i></div>
    <div id="clockTravel">Send a pulse to start</div>
    <ul id="clockArrivals"></ul>
  </div>

  <div id="head">
    <h2 id="title"><span class="orb"></span><span id="titleText">Earth</span></h2>
    <div id="epithet" class="eyebrow"></div>
    <p id="blurb"></p>
    <div id="chips"></div>
  </div>

  <div id="dock" class="card"></div>
  <div id="dots"></div>

  <div id="modes" class="card">
    <button data-mode="earth-moon" class="on">Earth &amp; Moon</button>
    <button data-mode="solar-system">Solar System</button>
    <span class="badge">demo</span>
  </div>

  <div id="side">
    <div id="overview" class="card">
      <div class="eyebrow">Overview</div>
      <div id="rows"></div>
    </div>
    <div id="tools" class="card">
      <div class="eyebrow">Tools</div>
      <ul id="toolList"></ul>
    </div>
    <div id="tip" class="card">
      <span class="ic">i</span>
      <span id="tipText">Drag to orbit, scroll to zoom. Pick a body on the left to fly there.</span>
      <button id="tipClose" aria-label="Dismiss">×</button>
    </div>
  </div>
</div>

<div id="loading">Loading textures</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module" src="./demo.js"></script>
</body>
</html>
